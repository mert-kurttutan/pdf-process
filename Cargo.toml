[package]
name = "pdf-process"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Convert PDFs into Datalab HTML and optional Typst."
authors = ["Mert Kurttutan <kurttutan.mert@gmail.com>"]
readme = "README.md"
default-run = "pdf-process"

[[bin]]
name = "pdf-process"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
